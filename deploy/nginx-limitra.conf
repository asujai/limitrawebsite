server {
    listen 80;
    listen [::]:80;

    server_name limitra.online www.limitra.online;
    return 301 https://limitra.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.limitra.online;

    ssl_certificate /etc/letsencrypt/live/limitra.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limitra.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://limitra.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name limitra.online;
    root /var/www/limitra/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/limitra.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limitra.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # AI bot ziyaretleri ayri loga yazilir (Faz 6.1 olcum). Ana access.log korunur.
    set $ai_bot 0;
    if ($http_user_agent ~* "GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-SearchBot|Claude-User|PerplexityBot|Perplexity-User|Google-Extended|Applebot|meta-external|Amazonbot|CCBot|Bytespider|bingbot") {
        set $ai_bot 1;
    }
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/limitra-ai-bots.log combined if=$ai_bot;

    location / {
        try_files $uri $uri/ =404;
    }

    # AdMob dogrulama dosyasi her istekte yeniden dogrulanabilsin.
    location = /app-ads.txt {
        try_files $uri =404;
        default_type text/plain;
        charset utf-8;
        expires -1;
        add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate";
    }

    # Diger makine-okunur kesif dosyalari: HTML sarmalayici yok, kisa cache.
    location ~ ^/(llms\.txt|llms-full\.txt)$ {
        try_files $uri =404;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        access_log off;
    }
}
