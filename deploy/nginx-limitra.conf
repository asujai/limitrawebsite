server {
    listen 80;
    listen [::]:80;

    server_name limitra.online www.limitra.online;
    return 301 https://limitra.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.limitra.online;

    ssl_certificate /etc/letsencrypt/live/limitra.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limitra.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://limitra.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name limitra.online;
    root /var/www/limitra/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/limitra.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limitra.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        access_log off;
    }
}
